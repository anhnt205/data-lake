services:
  report_reverse_proxy_service:
    image: report_reverse_proxy_img
    build:
      context: ./reverse_proxy
    ports:
      # HOST_PORT:CONTAINER_PORT
      - "8888:8888"
    stdin_open: true
    environment:
      - TZ=Asia/Ho_Chi_Minh
    networks:
      - backnet
      - frontnet
    depends_on:
      - report_backend_service
      - report_frontend_service

  report_backend_service:
    env_file:
      - ./be/.env
    image: report_backend_img
    build:
      context: ./be
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8484:8080"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - DB_URL=jdbc:postgresql://postgres:5432/report
      - DB_USERNAME=admin
      - DB_PASSWORD=admin
    networks:
      - backnet
    restart: unless-stopped

  report_frontend_service:
    env_file:
      - ./fe-modul-report/.env
    image: report_frontend_img
    build:
      context: ./fe-modul-report
    # target: development
    stdin_open: true
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      # For development only, to synced src code to container
      - /usr/src/app/node_modules
    # restart: always
    networks:
      - frontnet
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "30"

  postgres:
    container_name: pg_report_2211
    image: postgres:18.4
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=report
      - PGDATA=/var/lib/postgresql/data
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - report_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    restart: unless-stopped
    networks:
      - backnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d report"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: pgadmin_report_2211
    image: dpage/pgadmin4:8.6
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - report_pgadmin_data:/var/lib/pgadmin
      - ./backup:/backup
    ports:
      - "5050:80"
    restart: unless-stopped
    networks:
      - backnet

volumes:
  report_postgres_data: # ✅ Cho postgres
  report_pgadmin_data: # ✅ Cho pgadmin (thêm mới)

networks:
  backnet:
  frontnet:
