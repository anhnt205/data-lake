spring:
  application:
    name: report
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/report}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
server:
  port: 8080
  servlet:
    context-path: /api

aws:
  accessKeyId: ${AWS_ACCESSKEYID}
  secretAccessKey: ${AWS_SECRETACCESSKEY}
  s3:
    bucket: ${AWS_S3_BUCKET}
  region: ${AWS_REGION}

jwt:
  secret: ${JWT_SECRET}

datalake:
  base-url: http://113.22.123.208:1313

account:
  username: ${USERNAME_VINA}
  password: ${PASSWORD_VINA}

management:
  endpoints:
    web:
      exposure:
        include: health
    health:
      show-details: never
